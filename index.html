<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>밥친구</title>
<style>
:root{--ink:#40312a;--muted:#8a776b;--paper:#fffaf3;--line:#ead9c8;--accent:#e58b45}
*{box-sizing:border-box}body{margin:0;background:#f7eee5;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.app{max-width:720px;min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 0 30px #0001}
header{text-align:center;padding:30px 20px 22px;background:linear-gradient(#fffaf3,#fff0df);border-bottom:1px solid var(--line)}
.bowl{font-size:42px}h1{font-family:Georgia,serif;font-size:31px;margin:0 0 6px}.sub{font-size:13px;color:var(--muted)}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line)}nav button{flex:1;border:0;background:none;padding:13px 5px;color:var(--muted);font-size:13px}nav button.active{color:var(--ink);font-weight:700;border-bottom:2px solid var(--accent)}
main{padding:20px}.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:22px 8px 26px}.hero h2{font-family:Georgia,serif;font-size:23px;margin:5px 0 9px}.hero p{color:var(--muted);font-size:14px;line-height:1.7}
.primary{width:100%;border:0;border-radius:12px;padding:14px;background:var(--ink);color:#fff;font-weight:700;margin-top:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px}.title{font-weight:800;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fffdfb;outline:none}textarea{min-height:78px;resize:vertical}.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice button{border:1px solid var(--line);background:#fffaf5;border-radius:10px;padding:11px 8px;color:var(--ink)}.choice button.selected{border:2px solid var(--accent);background:#fff0df}
.actions{display:flex;gap:8px;margin-top:15px}.secondary{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px}.primary.small{flex:2;width:auto;margin:0}.record{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.date{width:58px;text-align:center;flex:none}.date b{display:block;font-size:18px}.date small,.meta{color:var(--muted)}.record-body{flex:1}.meal{font-size:12px;color:var(--accent);font-weight:700}.record-title{font-weight:800;margin:3px 0}.memo{font-size:13px;color:#615850;margin-top:6px;line-height:1.5}.empty{text-align:center;padding:35px 15px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 7px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.random{background:#fff0df;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;margin-top:15px}.random .emoji{font-size:28px}.random h3{font-family:Georgia,serif;margin:7px 0}
.record-actions{display:flex;gap:6px;margin-top:9px}.record-actions button{border:1px solid var(--line);background:#fffaf5;border-radius:7px;padding:5px 9px;font-size:11px;color:var(--muted)}.record-actions button.delete{color:#b36b58}.link{display:inline-block;margin-top:6px;color:var(--accent);font-size:12px;text-decoration:none}.back{border:0;background:none;padding:0;color:var(--muted);font-size:13px;margin-bottom:12px}
@media(max-width:500px){main{padding:14px}.choice{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}

.calendar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head button{border:0;background:var(--accent-soft,#fff0df);border-radius:8px;padding:7px 10px;color:var(--ink)}
.cal-month{font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-week{font-size:11px;color:var(--muted);padding:4px 0}
.cal-day{min-height:43px;border:1px solid transparent;border-radius:8px;background:#fffaf5;padding:5px 2px;font-size:12px}
.cal-day.empty{background:transparent}
.cal-day.has{background:#fff0df;border-color:#f0c89e;font-weight:800}
.cal-day .dot{display:block;color:var(--accent);font-size:9px;margin-top:2px}
.chart-title{font-weight:800;margin:18px 0 9px}
.bar-row{display:grid;grid-template-columns:88px 1fr 32px;gap:8px;align-items:center;margin:9px 0;font-size:12px}
.bar-track{height:10px;background:#f3e7dc;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px}
</style></head>
<body><div class="app">
<header><div class="bowl">🍚</div><h1>밥친구</h1><div class="sub">오늘도 밥친구와 함께 맛밥😋</div></header>
<nav><button class="active" data-tab="home">오늘</button><button data-tab="records">기록</button><button data-tab="stats">통계</button></nav>
<main>
<section id="home" class="screen active"><div class="hero"><h2>오늘의 밥친구를 기록해요</h2><p>밥 먹으며 본 것들을<br>10초 만에 남겨보세요.</p><button class="primary" onclick="start()">🍚 밥친구 기록하기</button></div><div id="today"></div></section>
<section id="form" class="screen"><button class="back" onclick="show('home')">← 오늘로</button>
<div class="card"><div class="title">🍚 어떤 식사였나요?</div>
<label>식사 날짜</label><input id="recordDate" type="date">
<div class="choice" data-key="meal"><button>🍳 아침</button><button>🍚 점심</button><button>🌙 저녁</button><button>🍪 간식</button><button>🍜 야식</button></div>
<label>함께 먹은 메뉴</label><input id="menu" placeholder="예: 김치찌개, 햄버거, 라면">
<label>어떤 친구와 함께했나요?</label><div class="choice" data-key="type"><button>▶️ 유튜브</button><button>🎬 영화</button><button>📺 드라마</button><button>🎞️ 애니메이션</button><button>✨ 기타</button></div>
<label>제목</label><input id="title" placeholder="예: 이상한 변호사 우영우 2화">
<label>플랫폼</label>
<select id="platform"><option value="">선택안함</option><option value="Netflix">Netflix</option><option value="YouTube">YouTube</option><option value="TV">TV</option><option value="Watcha">Watcha</option><option value="라프텔">라프텔</option><option value="티빙">티빙</option><option value="웨이브">웨이브</option><option value="쿠팡플레이">쿠팡플레이</option><option value="기타">기타</option></select>
<label>링크 <span style="font-weight:400;color:#999">(선택)</span></label>
<input id="url" type="url" placeholder="영상·작품 링크를 붙여넣을 수 있어요">
<label>리뷰</label>
<div id="stars" style="display:flex;gap:5px;margin:6px 0 4px">
<button type="button" class="star" data-star="1" style="border:0;background:none;font-size:29px;padding:2px;color:#d8cfc7">★</button>
<button type="button" class="star" data-star="2" style="border:0;background:none;font-size:29px;padding:2px;color:#d8cfc7">★</button>
<button type="button" class="star" data-star="3" style="border:0;background:none;font-size:29px;padding:2px;color:#d8cfc7">★</button>
<button type="button" class="star" data-star="4" style="border:0;background:none;font-size:29px;padding:2px;color:#d8cfc7">★</button>
<button type="button" class="star" data-star="5" style="border:0;background:none;font-size:29px;padding:2px;color:#d8cfc7">★</button>
</div>
<small id="ratingText" style="color:var(--muted)">별점을 선택해주세요.</small>
<label>한줄 메모 <span style="font-weight:400;color:#999">(선택)</span></label><textarea id="memo" placeholder="어땠는지 자유롭게 적어보세요."></textarea></div>
<div class="actions"><button class="secondary" onclick="show('home')">취소</button><button id="saveBtn" class="primary small" onclick="saveRecord()">기록하기 🍚</button></div></section>
<section id="records" class="screen"><div class="title">📚 밥친구 기록</div><div id="calendar"></div><div id="recordList"></div></section>
<section id="stats" class="screen"><div class="title">📊 나의 밥친구</div><div id="statsView"></div><div class="random" id="randomBox"></div></section>
</main></div>
<script>
const KEY='riceBuddy_v1';let records=JSON.parse(localStorage.getItem(KEY)||'[]'),answers={},rating=0,editingId=null;const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='home')renderToday();if(id==='records'){renderCalendar();renderRecords();}if(id==='stats')renderStats();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});
document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.star);document.querySelectorAll('.star').forEach(s=>s.style.color=Number(s.dataset.star)<=rating?'var(--accent)':'#d8cfc7');$('ratingText').textContent=rating+'점';});
document.querySelectorAll('.choice').forEach(g=>g.onclick=e=>{if(e.target.tagName!=='BUTTON')return;g.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));e.target.classList.add('selected');answers[g.dataset.key]=e.target.textContent});
function start(){
editingId=null;answers={};rating=0;
$('title').value='';$('menu').value='';$('platform').value='';$('url').value='';$('memo').value='';$('recordDate').value=new Date().toLocaleDateString('sv-SE');
$('ratingText').textContent='별점을 선택해주세요.';
$('saveBtn').textContent='기록하기 🍚';
document.querySelectorAll('.choice button').forEach(b=>b.classList.remove('selected'));
document.querySelectorAll('.star').forEach(b=>b.style.color='#d8cfc7');
show('form');
}
function editRecord(id){
const r=records.find(x=>x.id===id);if(!r)return;
editingId=id;answers={meal:r.meal,type:r.type};rating=r.rating||0;$('recordDate').value=new Date(r.date).toLocaleDateString('sv-SE');
$('title').value=r.title||'';$('menu').value=r.menu||'';$('platform').value=r.platform||'';$('url').value=r.url||'';$('memo').value=r.memo||'';
$('ratingText').textContent=rating?rating+'점':'별점을 선택해주세요.';
document.querySelectorAll('.choice').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.textContent===(g.dataset.key==='meal'?r.meal:r.type))));
document.querySelectorAll('.star').forEach(b=>b.style.color=Number(b.dataset.star)<=rating?'var(--accent)':'#d8cfc7');
$('saveBtn').textContent='수정 저장하기 ✓';
show('form');
}
function deleteRecord(id){
if(!confirm('이 밥친구 기록을 삭제할까요?'))return;
records=records.filter(r=>r.id!==id);save();renderToday();renderCalendar();renderRecords();renderStats();
}
function saveRecord(){
if(!answers.meal)return alert('식사를 선택해주세요.');
if(!answers.type)return alert('함께한 매체를 선택해주세요.');
if(!$('title').value.trim()){alert('제목을 적어주세요.');return}
const selectedDate=$('recordDate').value;if(!selectedDate){alert('식사 날짜를 선택해주세요.');return} const data={meal:answers.meal,type:answers.type,menu:$('menu').value.trim(),title:$('title').value.trim(),platform:$('platform').value.trim(),url:$('url').value.trim(),rating,memo:$('memo').value.trim()};
if(editingId!==null){const r=records.find(x=>x.id===editingId);if(r)Object.assign(r,data);}
else {const [y,m,d]=selectedDate.split('-').map(Number);records.unshift({id:Date.now(),date:new Date(y,m-1,d,12,0,0).toISOString(),...data});}
save();editingId=null;show('home');
}
function dp(iso){let d=new Date(iso);return{m:d.getMonth()+1,day:d.getDate(),full:d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}}
function renderToday(){let t=new Date().toDateString(),a=records.filter(r=>new Date(r.date).toDateString()===t);$('today').innerHTML=a.length?'<div class="card"><div class="title">오늘의 밥친구</div>'+a.map(card).join('')+'</div>':'<div class="empty">아직 오늘의 밥친구가 없어요.<br>첫 번째 밥친구를 기록해볼까요? 🍚</div>'}
function card(r){let d=dp(r.date);let stars=r.rating?' <span style="color:var(--accent);letter-spacing:1px">'+('★'.repeat(r.rating))+'</span>':'';let platform=r.platform?' · '+esc(r.platform):'';let link=r.url&&/^https?:\/\//i.test(r.url)?'<a class="link" href="'+esc(r.url)+'" target="_blank" rel="noopener">🔗 링크 열기</a>':'';return '<div class="record"><div class="date"><b>'+d.day+'</b><small>'+d.m+'월</small></div><div class="record-body"><div class="meal">'+esc(r.meal)+' · '+esc(r.type)+platform+'</div><div class="record-title">'+esc(r.title)+stars+'</div>'+(r.menu?'<div class="memo">🍴 '+esc(r.menu)+'</div>':'')+link+(r.memo?'<div class="memo">'+esc(r.memo)+'</div>':'')+'<div class="record-actions"><button onclick="editRecord('+r.id+')">✏️ 수정</button><button class="delete" onclick="deleteRecord('+r.id+')">🗑 삭제</button></div></div></div>'}

let calendarDate=new Date();

function renderCalendar(){
  const y=calendarDate.getFullYear(), m=calendarDate.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const counts={};
  records.forEach(r=>{
    const d=new Date(r.date);
    if(d.getFullYear()===y && d.getMonth()===m){
      const day=d.getDate(); counts[day]=(counts[day]||0)+1;
    }
  });
  let cells='';
  for(let i=0;i<first.getDay();i++) cells+='<div class="cal-day empty"></div>';
  for(let day=1;day<=last.getDate();day++){
    const c=counts[day]||0;
    cells+='<div class="cal-day '+(c?'has':'')+'"><b>'+day+'</b>'+(c?'<span class="dot">● '+c+'</span>':'')+'</div>';
  }
  $('calendar').innerHTML='<div class="calendar"><div class="cal-head"><button onclick="changeMonth(-1)">‹</button><div class="cal-month">'+y+'년 '+(m+1)+'월</div><button onclick="changeMonth(1)">›</button></div><div class="cal-grid">'+
    ['일','월','화','수','목','금','토'].map(d=>'<div class="cal-week">'+d+'</div>').join('')+cells+
    '</div></div>';
}
function changeMonth(n){calendarDate.setMonth(calendarDate.getMonth()+n);renderCalendar();}

function renderRecords(){if(!records.length){$('recordList').innerHTML='<div class="empty">아직 기록이 없어요.<br>밥 먹으면서 함께한 것을 남겨보세요. 🍚</div>';return}let g={};records.forEach(r=>{let k=dp(r.date).full;(g[k]??=[]).push(r)});$('recordList').innerHTML=Object.entries(g).map(([d,a])=>'<div class="card"><div class="title">'+d+'</div>'+a.map(r=>'<div class="record"><div class="record-body"><div class="meal">'+esc(r.meal)+' · '+esc(r.type)+(r.platform?' · '+esc(r.platform):'')+'</div><div class="record-title">'+esc(r.title)+(r.rating?' <span style="color:var(--accent);letter-spacing:1px">'+('★'.repeat(r.rating))+'</span>':'')+'</div>'+(r.menu?'<div class="memo">🍴 '+esc(r.menu)+'</div>':'')+(r.url&&/^https?:\/\//i.test(r.url)?'<a class="link" href="'+esc(r.url)+'" target="_blank" rel="noopener">🔗 링크 열기</a>':'')+(r.memo?'<div class="memo">'+esc(r.memo)+'</div>':'')+'<div class="record-actions"><button onclick="editRecord('+r.id+')">✏️ 수정</button><button class="delete" onclick="deleteRecord('+r.id+')">🗑 삭제</button></div></div></div>').join('')+'</div>').join('')}
function renderStats(){
let types={},platforms={},meals={},menus={};
records.forEach(r=>{
  types[r.type]=(types[r.type]||0)+1;
  if(r.platform) platforms[r.platform]=(platforms[r.platform]||0)+1;
  meals[r.meal]=(meals[r.meal]||0)+1;
  if(r.menu) menus[r.menu]=(menus[r.menu]||0)+1;
});
let top=Object.entries(types).sort((a,b)=>b[1]-a[1])[0];
let topPlatform=Object.entries(platforms).sort((a,b)=>b[1]-a[1])[0];
let days=new Set(records.map(r=>new Date(r.date).toDateString())).size;
let rated=records.filter(r=>r.rating),avg=rated.length?(rated.reduce((a,r)=>a+r.rating,0)/rated.length).toFixed(1):'-';
let maxType=Math.max(1,...Object.values(types)),maxPlatform=Math.max(1,...Object.values(platforms)),maxMeal=Math.max(1,...Object.values(meals)),maxMenu=Math.max(1,...Object.values(menus));
let typeBars=Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="bar-row"><span>'+esc(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(v/maxType*100)+'%"></div></div><b>'+v+'</b></div>').join('');
let platformBars=Object.entries(platforms).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="bar-row"><span>'+esc(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(v/maxPlatform*100)+'%"></div></div><b>'+v+'</b></div>').join('');
let mealOrder=['🍳 아침','🍚 점심','🌙 저녁','🍪 간식','🍜 야식'];
let mealBars=mealOrder.filter(k=>meals[k]).map(k=>'<div class="bar-row"><span>'+esc(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(meals[k]/maxMeal*100)+'%"></div></div><b>'+meals[k]+'</b></div>').join('');
let menuBars=Object.entries(menus).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>'<div class="bar-row"><span>'+esc(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(v/maxMenu*100)+'%"></div></div><b>'+v+'</b></div>').join('');
$('statsView').innerHTML=
'<div class="stats">'+
'<div class="stat"><b>'+records.length+'</b><span>총 밥친구</span></div>'+
'<div class="stat"><b>'+days+'</b><span>기록한 날</span></div>'+
'<div class="stat"><b>'+(top?esc(top[0]).split(' ')[0]:'-')+'</b><span>가장 자주 본 매체</span></div>'+
'<div class="stat"><b>'+(topPlatform?esc(topPlatform[0]):'-')+'</b><span>가장 많이 본 플랫폼</span></div>'+
'<div class="stat"><b>'+avg+(avg!=='-'?' ★':'')+'</b><span>평균 별점</span></div>'+
'</div>'+
'<div class="card">'+
'<div class="chart-title" style="margin-top:0">함께한 끼니</div>'+
(mealBars||'<small>아직 기록이 없어요.</small>')+
'<div class="chart-title">🍴 함께 먹은 메뉴</div>'+
(menuBars||'<small>메뉴를 입력한 기록이 아직 없어요.</small>')+
'<div class="chart-title">매체별 기록</div>'+
(typeBars||'<small>아직 데이터가 없어요.</small>')+
'<div class="chart-title">플랫폼별 기록</div>'+
(platformBars||'<small>플랫폼을 입력한 기록이 아직 없어요.</small>')+
'</div>';
$('randomBox').innerHTML=records.length?
'<div class="emoji">🎲</div><h3>기억 하나 뽑아보기</h3><p>'+esc(records[Math.floor(Math.random()*records.length)].title)+'</p><button class="secondary" onclick="renderStats()">다시 뽑기</button>':
'<div class="emoji">🍚</div><h3>아직 추억이 없어요</h3><p>기록이 쌓이면 랜덤으로 하나를 꺼내볼 수 있어요.</p>';
}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}renderToday();
</script></body></html>
